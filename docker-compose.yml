services:
  localstack:
    container_name: rds-sentinel-localstack
    image: localstack/localstack:3.8.0
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=1
      - LAMBDA_DOCKER_FLAGS=--rm
      - LAMBDA_REMOVE_CONTAINERS=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
